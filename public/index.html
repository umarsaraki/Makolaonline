<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakolaOnline.com — Buy, Sell &amp; Work in Ghana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FCD116;
  --green:#006B3F;
  --green-dark:#00502F;
  --red:#CE1126;
  --white:#FFFFFF;
  --ink:#1A1A1A;
  --ink-soft:#5B5B5B;
  --bg:#FAFAF8;
  --surface:#FFFFFF;
  --surface-2:#F1EFE7;
  --line:#E6E3DA;
  --radius:6px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;font-weight:600;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}

/* ---------- Header ---------- */
header.topbar{background:var(--green);border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:50;}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
.logo{color:var(--white);font-size:22px;font-weight:700;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px;}
.logo .dot{width:10px;height:10px;background:var(--yellow);border-radius:50%;}
.cart-btn{position:relative;background:var(--yellow);color:var(--green-dark);border:none;padding:8px 14px;border-radius:var(--radius);font-weight:700;font-size:14px;}
.cart-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}

/* ---------- Bottom Navigation ---------- */
nav.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--green);border-top:3px solid var(--yellow);
  display:flex;justify-content:space-around;padding:6px 4px 8px;}
nav.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.75);
  font-size:11px;font-weight:600;padding:4px 2px;border-radius:8px;min-width:0;}
nav.bottomnav a .ic{font-size:19px;line-height:1;}
nav.bottomnav a.active{color:var(--yellow);}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:0 auto;padding:28px 20px 24px;min-height:60vh;}
.section-title{font-size:22px;margin-bottom:14px;}
.muted{color:var(--ink-soft);font-size:14px;}

/* ---------- Buttons ---------- */
.btn{display:inline-block;border:none;padding:11px 20px;border-radius:var(--radius);font-weight:700;font-size:14px;}
.btn-primary{background:var(--yellow);color:var(--green-dark);}
.btn-primary:hover{background:#ecc300;}
.btn-outline{background:transparent;border:2px solid var(--green);color:var(--green);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:4px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Banner slider ---------- */
.banner{position:relative;border-radius:10px;overflow:hidden;height:220px;background:linear-gradient(120deg,var(--green),var(--green-dark));margin-bottom:26px;}
.banner img{width:100%;height:100%;object-fit:cover;}
.banner-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
.banner-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);}
.banner-dots span.on{background:var(--yellow);}
.banner-empty{color:#fff;display:flex;align-items:center;justify-content:center;height:100%;font-family:'Space Grotesk';font-size:20px;}

/* ---------- Search (wraps on narrow screens instead of overflowing) ---------- */
.searchbar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.searchbar input{flex:2 1 160px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:var(--surface);color:var(--ink);}
.searchbar select{flex:1 1 130px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:var(--surface);color:var(--ink);}
.searchbar button{flex:1 1 100px;}

/* ---------- Grid / Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
.card .thumb{height:140px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px;}
.card .thumb img{width:100%;height:100%;object-fit:cover;}
.card .body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px;}
.card h4{font-size:15px;color:var(--ink);}
.price{color:var(--green);font-weight:700;font-family:'Space Grotesk';font-size:16px;}
.card .body .muted{font-size:12px;}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px;}

.job-card{border-top:4px solid var(--red);}
.job-card .salary{color:var(--red);font-weight:700;}

/* ---------- Forms ---------- */
.form-box{max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px;}
.form-box h2{margin-bottom:4px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink);}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink);}
.field textarea{resize:vertical;min-height:70px;}
.error-box{background:#FDEBEC;color:var(--red);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:12px;}
.ok-box{background:#E8F5EE;color:var(--green-dark);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:12px;}
.switch-link{text-align:center;margin-top:14px;font-size:13px;}

/* ---------- Profile: header card + menu list ---------- */
.profile-header{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:10px;padding:18px;margin-bottom:18px;}
.avatar-circle{width:52px;height:52px;border-radius:50%;background:var(--yellow);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;font-family:'Space Grotesk';flex-shrink:0;}
.profile-header .pname{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.profile-header .pemail{color:var(--ink-soft);font-size:13px;margin-top:2px;}
.menu-list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.menu-item:last-child{border-bottom:none;}
.menu-item:active{background:var(--surface-2);}
.menu-item .mi-icon{font-size:20px;width:24px;text-align:center;flex-shrink:0;}
.menu-item .mi-label{flex:1;font-size:14px;font-weight:600;}
.menu-item .mi-chevron{color:var(--ink-soft);font-size:16px;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}

/* ---------- Tabs (Admin) ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px;}
.tabs button{background:none;border:none;padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);border-bottom:3px solid transparent;}
.tabs button.active{color:var(--green);border-color:var(--green);}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:13px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);}
th{background:var(--surface-2);font-family:'Space Grotesk';font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);}
tr:last-child td{border-bottom:none;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.pending{background:#FFF3CD;color:#8a6d00;}
.badge.approved,.badge.completed,.badge.active,.badge.solved{background:#E8F5EE;color:var(--green-dark);}
.badge.rejected,.badge.banned,.badge.expired{background:#FDEBEC;color:var(--red);}
.badge.processing{background:#E7F0FF;color:#1d4ed8;}
.badge.shipped{background:#EFE7FF;color:#6d28d9;}

.wallet-row{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.wallet-card{flex:1;min-width:200px;background:var(--green);color:#fff;border-radius:10px;padding:20px;}
.wallet-card.cashback{background:var(--yellow);color:var(--green-dark);}
.wallet-card .amt{font-family:'Space Grotesk';font-size:26px;margin-top:6px;}

.empty{text-align:center;padding:50px 10px;color:var(--ink-soft);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border-radius:10px;max-width:460px;width:100%;max-height:86vh;overflow:auto;padding:22px;}
.modal h3{margin-bottom:14px;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);}

/* ---------- Help chat widget ---------- */
.chat-bubble{position:fixed;bottom:78px;right:16px;background:var(--green);color:#fff;width:52px;height:52px;border-radius:50%;border:none;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:80;}
.chat-window{position:fixed;bottom:138px;right:16px;width:280px;max-height:400px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:80;}
.chat-window.open{display:flex;}
.chat-head{background:var(--green);color:#fff;padding:12px 14px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;}
.chat-body{flex:1;overflow:auto;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:8px;}
.chat-msg{padding:8px 10px;border-radius:8px;max-width:85%;}
.chat-msg.bot{background:var(--surface-2);color:var(--ink);align-self:flex-start;}
.chat-msg.me{background:var(--yellow);color:var(--green-dark);align-self:flex-end;}
.chat-foot{display:flex;border-top:1px solid var(--line);}
.chat-foot input{flex:1;border:none;padding:10px;font-size:13px;background:var(--surface);color:var(--ink);}
.chat-foot button{background:var(--green);color:#fff;border:none;padding:0 14px;font-weight:700;}

footer.sitefoot{text-align:center;padding:24px;color:var(--ink-soft);font-size:12px;border-top:1px solid var(--line);}
footer.sitefoot a{color:var(--green);font-weight:600;}

.bell-dropdown{position:absolute;top:44px;right:0;width:280px;max-height:340px;overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:90;}
.bell-item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;}
.bell-item:last-child{border-bottom:none;}
.bell-item.unread{background:#FFF8E1;}
.bell-item .bt{color:var(--ink-soft);font-size:11px;margin-top:3px;}

@keyframes mkoToastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

@keyframes mkoToastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="dot"></span>MakolaOnline</div>
    <div style="display:flex;align-items:center;gap:8px;position:relative">
      <button class="cart-btn" id="msgBtn" style="background:transparent;color:#fff;font-size:18px;padding:8px">✉️<span class="cart-badge" id="msgBadge" style="display:none">0</span></button>
      <button class="cart-btn" id="bellBtn" style="background:transparent;color:#fff;font-size:18px;padding:8px">🔔<span class="cart-badge" id="bellBadge" style="display:none">0</span></button>
      <div id="bellDropdown"></div>
      <button class="cart-btn" id="cartBtn">Cart <span id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="sitefoot">
  &copy; 2026 MakolaOnline.com — Ghana's Marketplace
</footer>

<button class="chat-bubble" id="chatBubble">&#128172;</button>
<div class="chat-window" id="chatWindow">
  <div class="chat-head">MakolaOnline Help</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-foot">
    <input id="chatInput" placeholder="Type your question...">
    <button id="chatSend">Send</button>
  </div>
</div>

<nav class="bottomnav" id="bottomNav"></nav>

<script>
/* ============================================================
   MakolaOnline.com — single-file SPA frontend
   Talks to the Express/PostgreSQL API defined in server.js
   ============================================================ */

const state = {
  token: localStorage.getItem('mko_token') || null,
  user: null,
  page: 'home',
  depositFlash: null,
  cart: JSON.parse(localStorage.getItem('mko_cart') || '[]'),
};

function parseHash() {
  const raw = location.hash.replace('#', '') || 'home';
  const [page, queryStr] = raw.split('?');
  return { page: page || 'home', params: new URLSearchParams(queryStr || '') };
}
const initial = parseHash();
state.page = initial.page;
if (initial.params.get('deposit')) state.depositFlash = initial.params.get('deposit');

/* ---------------- API helper ---------------- */
/* ---------------- Toast & Confirm (replaces native alert/confirm) ---------------- */
function showToast(message, type = 'error') {
  document.querySelectorAll('.mko-toast').forEach(t => t.remove());
  const toast = document.createElement('div');
  toast.className = 'mko-toast';
  const bg = type === 'success' ? 'var(--green-dark)' : type === 'info' ? '#1d4ed8' : 'var(--red)';
  toast.style.cssText = `position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:90%;
    background:${bg};color:#fff;padding:13px 18px;border-radius:10px;font-size:14px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:200;text-align:center;animation:mkoToastIn .25s ease-out;`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.transition = 'opacity .3s'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3200);
}
function showConfirm(message) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.zIndex = 300;
    overlay.innerHTML = `
      <div class="modal" style="max-width:340px;text-align:center">
        <p style="margin-bottom:18px">${message}</p>
        <div style="display:flex;gap:10px">
          <button class="btn btn-outline" id="mkoConfirmNo" style="flex:1">Cancel</button>
          <button class="btn btn-danger" id="mkoConfirmYes" style="flex:1">Confirm</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('mkoConfirmYes').onclick = () => { overlay.remove(); resolve(true); };
    document.getElementById('mkoConfirmNo').onclick = () => { overlay.remove(); resolve(false); };
  });
}
function showPrompt(message, defaultValue = '') {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.zIndex = 300;
    overlay.innerHTML = `
      <div class="modal" style="max-width:340px">
        <p style="margin-bottom:10px">${message}</p>
        <input id="mkoPromptInput" value="${defaultValue}" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px">
        <div style="display:flex;gap:10px">
          <button class="btn btn-outline" id="mkoPromptCancel" style="flex:1">Cancel</button>
          <button class="btn btn-primary" id="mkoPromptOk" style="flex:1">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = document.getElementById('mkoPromptInput');
    input.focus();
    const finish = (val) => { overlay.remove(); resolve(val); };
    document.getElementById('mkoPromptOk').onclick = () => finish(input.value);
    document.getElementById('mkoPromptCancel').onclick = () => finish(null);
    input.onkeydown = (e) => { if (e.key === 'Enter') finish(input.value); };
  });
}

function safeMsg(text) {
  const msg = typeof text === 'string' ? text : '';
  const technical = /relation |column |duplicate key|violates|syntax error|ECONN|null value|at Object|at async|\.js:\d|constraint|stack|undefined is not|Cannot read prop/i;
  if (!msg || technical.test(msg) || msg.length > 180) return 'Something went wrong. Please try again.';
  return msg;
}
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  let res;
  try {
    res = await fetch(path, { ...opts, headers });
  } catch (networkErr) {
    throw new Error('Connection problem — please check your internet and try again.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(safeMsg(data.error));
  return data;
}

// Uploads a picked photo and returns its hosted URL. Deliberately does NOT go through api()
// because FormData needs the browser to set its own multipart Content-Type boundary.
async function uploadImage(file) {
  const formData = new FormData();
  formData.append('image', file);
  let res;
  try {
    res = await fetch('/api/upload-image', {
      method: 'POST',
      headers: state.token ? { Authorization: 'Bearer ' + state.token } : {},
      body: formData,
    });
  } catch (networkErr) {
    throw new Error('Connection problem — please check your internet and try again.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(safeMsg(data.error) || 'Photo upload failed.');
  return data.url;
}

function saveCart() { localStorage.setItem('mko_cart', JSON.stringify(state.cart)); renderCartCount(); }
function renderCartCount() { document.getElementById('cartCount').textContent = state.cart.reduce((s, i) => s + i.qty, 0); }

function money(n) { return '₵' + Number(n || 0).toFixed(2); }

function go(page) { location.hash = page; }

window.addEventListener('hashchange', () => {
  const { page, params } = parseHash();
  state.page = page;
  if (params.get('deposit')) state.depositFlash = params.get('deposit');
  render();
});

/* ---------------- Nav (bottom bar) ---------------- */
function renderNav() {
  const items = [
    ['home', '🏠', 'HOME'], ['services', '💼', 'SERVICES'], ['vendor', '🏪', 'VENDOR'],
    ['orders', '📦', 'ORDER'], ['profile', '👤', 'PROFILE'],
  ];
  // Admin Panel now lives inside the Profile menu, not the bottom bar.
  const nav = document.getElementById('bottomNav');
  nav.innerHTML = items.map(([id, icon, label]) =>
    `<a href="#${id}" class="${state.page === id ? 'active' : ''}"><span class="ic">${icon}</span>${label}</a>`
  ).join('');
}

function logout() {
  state.token = null; state.user = null;
  localStorage.removeItem('mko_token');
  go('home');
}

/* ---------------- Root render ---------------- */
async function loadUser() {
  if (!state.token) { state.user = null; return; }
  try { state.user = await api('/api/profile'); }
  catch { state.token = null; localStorage.removeItem('mko_token'); state.user = null; }
}

async function render() {
  renderNav();
  renderCartCount();
  refreshBell();
  refreshMsgBadge();
  const app = document.getElementById('app');
  app.innerHTML = '<p class="muted">Loading...</p>';

  const authPages = ['vendor', 'orders', 'profile', 'admin'];
  if (authPages.includes(state.page) && !state.user) { go('login'); return; }

  if (state.user && state.user.status === 'banned') { await renderBannedView(app); return; }

  if (state.page === 'profile' && state.depositFlash) profileTab = 'wallet';

  try {
    switch (state.page) {
      case 'home': await renderHome(app); break;
      case 'services': await renderServices(app); break;
      case 'vendor': await renderVendor(app); break;
      case 'orders': await renderOrders(app); break;
      case 'profile': await renderProfile(app); break;
      case 'admin': await renderAdmin(app); break;
      case 'login': renderLogin(app); break;
      case 'register': renderRegister(app); break;
      case 'privacy': renderPrivacy(app); break;
      case 'help': renderHelp(app); break;
      default: await renderHome(app); break;
    }
    if (state.depositFlash) {
      const banner = document.createElement('div');
      banner.className = state.depositFlash === 'success' ? 'ok-box' : 'error-box';
      banner.textContent = state.depositFlash === 'success'
        ? 'Deposit successful — your Available Balance has been updated.'
        : 'Deposit was not completed.';
      app.prepend(banner);
      state.depositFlash = null;
    }
  } catch (err) {
    app.innerHTML = `<div class="error-box">${err.message}<br><span class="muted">Make sure the Node.js server (npm run dev) is running, and that you're opening the site via http://localhost:5000 — not by opening the file directly.</span></div>`;
  }
}

/* ================= HOME ================= */
async function renderHome(app) {
  const [banners, products] = await Promise.all([
    api('/api/banners').catch(() => []),
    api('/api/products'),
  ]);

  app.innerHTML = `
    <div class="banner" id="bannerBox">
      ${banners.length ? banners.map((b, i) => `
        <a href="${b.link || '#'}" style="display:${i === 0 ? 'block' : 'none'};height:100%">
          <img src="${b.image_url}" alt="banner">
        </a>`).join('') : `<div class="banner-empty">Welcome to MakolaOnline — Buy &amp; Sell across Ghana 🇬🇭</div>`}
      ${banners.length > 1 ? `<div class="banner-dots">${banners.map((_, i) => `<span class="${i === 0 ? 'on' : ''}"></span>`).join('')}</div>` : ''}
    </div>
    <div class="searchbar">
      <input id="searchInput" placeholder="Search products e.g. rice, shoes, phone...">
      <select id="categorySelect">
        <option value="">All Categories</option>
        <option>Electronics</option><option>Fashion</option><option>Food &amp; Groceries</option>
        <option>Beauty</option><option>Home &amp; Living</option><option>Other</option>
      </select>

function openImageLightbox(urls, startIdx = 0) {
  document.querySelector('.lightbox-overlay')?.remove();
  let idx = startIdx;
  let zoomed = false;

  const overlay = document.createElement('div');
  overlay.className = 'overlay lightbox-overlay';
  overlay.style.userSelect = 'none';

  const frame = document.createElement('div');
  frame.style.cssText = 'position:relative;max-width:100%;text-align:center;';

  const img = document.createElement('img');
  img.style.cssText = 'max-width:100%;max-height:80vh;border-radius:10px;transition:transform .2s;cursor:zoom-in;';
  img.ondblclick = (e) => {
    e.stopPropagation();
    zoomed = !zoomed;
    img.style.transform = zoomed ? 'scale(2.2)' : 'scale(1)';
    img.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
  };
  frame.appendChild(img);

  function renderFrame() {
    img.src = urls[idx];
    zoomed = false;
    img.style.transform = 'scale(1)';
    img.style.cursor = 'zoom-in';
  }
  renderFrame();

  if (urls.length > 1) {
    const counter = document.createElement('div');
    counter.style.cssText = 'margin-top:10px;color:#fff;';
    frame.appendChild(counter);
    function updateCounter() { counter.textContent = (idx + 1) + ' / ' + urls.length; }
    updateCounter();

    const mkArrow = (symbol, dir) => {
      const btn = document.createElement('button');
      btn.textContent = symbol;
      btn.style.cssText = `position:absolute;${dir === 'prev' ? 'left' : 'right'}:10px;top:45%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;z-index:5;`;
      btn.onclick = (e) => {
        e.stopPropagation();
        idx = dir === 'prev' ? (idx - 1 + urls.length) % urls.length : (idx + 1) % urls.length;
        renderFrame();
        updateCounter();
      };
      return btn;
    };
    frame.appendChild(mkArrow('‹', 'prev'));
    frame.appendChild(mkArrow('›', 'next'));
  }

  const hint = document.createElement('div');
  hint.textContent = 'Double-tap photo to zoom';
  hint.style.cssText = 'margin-top:6px;color:rgba(255,255,255,.7);font-size:12px;';
  frame.appendChild(hint);

  overlay.appendChild(frame);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function addToCart(id, name, price) {
  const existing = state.cart.find(i => i.product_id === id);
  if (existing) existing.qty += 1;
  else state.cart.push({ product_id: id, name, price, qty: 1 });
  saveCart();
}

/* ================= NOTIFICATIONS (bell) ================= */
async function refreshBell() {
  if (!state.user) { document.getElementById('bellBadge').style.display = 'none'; return; }
  try {
    const notifs = await api('/api/notifications');
    const unread = notifs.filter(n => !n.is_read).length;
    const badge = document.getElementById('bellBadge');
    badge.style.display = unread ? 'flex' : 'none';
    badge.textContent = unread;
    return notifs;
  } catch { return []; }
}
async function refreshMsgBadge() {
  if (!state.user) { document.getElementById('msgBadge').style.display = 'none'; return; }
  try {
    const r = await api('/api/support/unread-count');
    const badge = document.getElementById('msgBadge');
    badge.style.display = r.count ? 'flex' : 'none';
    badge.textContent = r.count;
  } catch { /* ignore */ }
}
document.getElementById('msgBtn').onclick = () => {
  if (!state.user) { go('login'); return; }
  profileTab = 'messages';
  go('profile');
};
document.getElementById('bellBtn').onclick = async () => {
  const holder = document.getElementById('bellDropdown');
  if (holder.innerHTML) { holder.innerHTML = ''; return; }
  if (!state.user) { go('login'); return; }
  const notifs = await refreshBell();
  holder.innerHTML = `<div class="bell-dropdown">
    ${notifs.length ? notifs.map(n => `
      <div class="bell-item ${n.is_read ? '' : 'unread'}">
        ${n.message}<div class="bt">${new Date(n.created_at).toLocaleString()}</div>
      </div>`).join('') : `<div class="bell-item muted">No notifications yet.</div>`}
  </div>`;
  // Opening the dropdown IS viewing them — mark everything read and clear the badge.
  if (notifs.some(n => !n.is_read)) {
    await api('/api/notifications/mark-all-read', { method: 'POST' });
    refreshBell();
  }
};
document.addEventListener('click', (e) => {
  const holder = document.getElementById('bellDropdown');
  if (holder && holder.innerHTML && !e.target.closest('#bellDropdown') && !e.target.closest('#bellBtn')) holder.innerHTML = '';
});

document.getElementById('cartBtn').onclick = () => openCartModal();

function openCartModal() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  const total = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
  overlay.innerHTML = `
    <div class="modal">
      <h3>Your Cart</h3>
      ${state.cart.length ? `
        <table>
          <tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr>
          ${state.cart.map((i, idx) => `
            <tr><td>${i.name}</td><td>${i.qty}</td><td>${money(i.price * i.qty)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="removeFromCart(${idx})">✕</button></td></tr>`).join('')}
        </table>
        <p style="margin:12px 0;font-weight:700">Total: ${money(total)}</p>
        <button class="btn btn-primary" id="toCheckoutBtn" style="width:100%">Checkout →</button>
      ` : `<p class="muted">Your cart is empty.</p>`}
      <button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="this.closest('.overlay').remove()">Close</button>
    </div>`;
  document.body.appendChild(overlay);
  const cb = document.getElementById('toCheckoutBtn');
  if (cb) cb.onclick = () => {
    if (!state.user) { overlay.remove(); go('login'); return; }
    overlay.remove();
    openDeliveryDetailsModal();
  };
}

function openDeliveryDetailsModal() {
  const total = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal">
      <h3>Delivery Details</h3>
      <p class="muted">Total: ${money(total)}</p>
      <div class="field"><label>Full Name</label><input id="coFullName" value="${state.user.name || ''}"></div>
      <div class="field"><label>Phone Number</label><input id="coPhone" value="${state.user.phone || ''}"></div>
      <div class="field" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="coWaEnabled" checked style="width:auto;margin:0">
        <label style="margin:0">This phone number is on WhatsApp</label>
      </div>
      <div class="field" id="coWaNumberBox" style="display:none"><label>WhatsApp Number</label><input id="coWaNumber"></div>
      <div class="field"><label>State / Region</label><input id="coRegion" placeholder="e.g. Greater Accra"></div>
      <div class="field"><label>Full Address</label><textarea id="coAddress"></textarea></div>
      <div class="field"><label>MakolaOnline Coupon (optional)</label><input id="cartCoupon" placeholder="e.g. SAVE10"></div>
      <div class="field"><label>Seller's Discount Code (optional)</label><input id="cartResellerCoupon" placeholder="e.g. WELCOME10"></div>
      <button class="btn btn-primary" id="checkoutBtn" style="width:100%">Pay ${money(total)}</button>
      <button class="btn btn-outline btn-sm" style="margin-top:10px;width:100%" onclick="this.closest('.overlay').remove()">← Back to Cart</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('coWaEnabled').onchange = (e) => {
    document.getElementById('coWaNumberBox').style.display = e.target.checked ? 'none' : 'block';
  };
  document.getElementById('checkoutBtn').onclick = async () => {
    const full_name = document.getElementById('coFullName').value;
    const phone = document.getElementById('coPhone').value;
    const address = document.getElementById('coAddress').value;
    if (!full_name || !phone || !address) return showToast('Full name, phone, and address are required.');
    try {
      await api('/api/orders', {
        method: 'POST',
        body: JSON.stringify({
          items: state.cart.map(i => ({ product_id: i.product_id, qty: i.qty })),
          full_name, phone,
          whatsapp_enabled: document.getElementById('coWaEnabled').checked,
          whatsapp_number: document.getElementById('coWaNumber').value,
          region: document.getElementById('coRegion').value,
          address,
          coupon_code: document.getElementById('cartCoupon').value.trim() || undefined,
          reseller_coupon_code: document.getElementById('cartResellerCoupon').value.trim() || undefined,
        }),
      });
      state.cart = []; saveCart(); overlay.remove(); go('orders');
    } catch (err) {
      if (/balance|deposit/i.test(err.message)) {
        if (await showConfirm(err.message + ' Open Deposit now?')) openDepositModal();
      } else {
        showToast(err.message);
      }
    }
  };
}

function removeFromCart(idx) {
  state.cart.splice(idx, 1); saveCart();
  document.querySelector('.overlay')?.remove();
  openCartModal();
}

/* ================= PROFILE ================= */
let profileTab = null; // null = show the main menu list
async function renderProfile(app) {
  if (!profileTab) {
    const items = [
      ['history', '📜', 'Order History'],
    ];
    if (state.user.role === 'reseller') items.push(['reseller', '🏬', 'Reseller Dashboard', 'Active']);
    if (state.user.role === 'employer') items.push(['employer', '🧰', 'Employer Dashboard', 'Active']);
    if (state.user.role === 'reseller' || state.user.role === 'employer') items.push(['subscription', '📅', 'My Subscription']);
    items.push(['addresses', '📍', 'Delivery Addresses']);
    items.push(['wallet', '👛', 'Wallet & Cashback']);
    if (state.user.isAdmin) items.push(['admin-link', '🛠️', 'Admin Panel', 'Owner only']);
    items.push(['messages', '✉️', 'Message Center']);
    items.push(['privacy-link', '📄', 'Privacy Policy & Terms']);
    items.push(['help-link', '🆘', 'Help & Support']);
    items.push(['logout-link', '🚪', 'Log Out']);

    app.innerHTML = `
      <div class="profile-header">
        <div class="avatar-circle">${state.user.name.charAt(0).toUpperCase()}</div>
        <div>
          <div class="pname">${state.user.name} <span class="badge ${state.user.status}">${state.user.status}</span></div>
          <div class="pemail">${state.user.email}</div>
        </div>
      </div>
      <div class="menu-list">
        ${items.map(([id, icon, label, badge]) => `
          <div class="menu-item" data-mi="${id}">
            <span class="mi-icon">${icon}</span>
            <span class="mi-label">${label}</span>
            ${badge ? `<span class="badge active">${badge}</span>` : ''}
            <span class="mi-chevron">›</span>
          </div>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('[data-mi]').forEach(el => el.onclick = () => {
      const id = el.dataset.mi;
      if (id === 'admin-link') return go('admin');
      if (id === 'privacy-link') return go('privacy');
      if (id === 'help-link') return go('help');
      if (id === 'logout-link') return logout();
      profileTab = id;
      renderProfile(app);
    });
    return;
  }

  const titles = {
    history: 'Order History', reseller: 'Reseller Dashboard', employer: 'Employer Dashboard',
    addresses: 'Delivery Addresses', wallet: 'Wallet & Cashback', subscription: 'My Subscription',
    messages: 'Message Center',
  };
  app.innerHTML = `
    <div class="back-row">
      <button class="btn btn-outline btn-sm" id="backToMenu">← Back</button>
      <h2 class="section-title" style="margin:0">${titles[profileTab] || ''}</h2>
    </div>
    <div id="profileContent"></div>
  `;
  document.getElementById('backToMenu').onclick = () => { profileTab = null; renderProfile(app); };

  const content = document.getElementById('profileContent');
  if (profileTab === 'history') {
    const hist = await api('/api/history');
    content.innerHTML = hist.length ? `
      <table><tr><th>Action</th><th>Details</th><th>Date</th></tr>
      ${hist.map(h => `<tr style="cursor:pointer" onclick='viewHistoryDetail(${JSON.stringify(h).replace(/'/g, "&apos;")})'><td>${h.action}</td><td>${h.details || '—'}</td><td>${new Date(h.created_at).toLocaleString()}</td></tr>`).join('')}
      </table>` : `<div class="empty">No history yet.</div>`;
  } else if (profileTab === 'addresses') {
    await renderAddresses(content);
  } else if (profileTab === 'wallet') {
    await renderWallet(content);
  } else if (profileTab === 'reseller') {
    await renderResellerDashboard(content);
  } else if (profileTab === 'employer') {
    await renderEmployerDashboard(content);
  } else if (profileTab === 'subscription') {
    await renderSubscriptionTab(content);
  } else if (profileTab === 'messages') {
    await renderMessageCenter(content);
  }
}

      <h3>Add Address</h3>

      <div class="field"><label>City</label><input id="addrCity"></div>
      <div class="field"><label>Region</label><input id="addrRegion"></div>
      <button class="btn btn-primary" id="addAddrBtn">Save Address</button>

      ${list.map(a => `<tr><td>${a.address_line}</td><td>${a.city || '—'}</td><td>${a.region || '—'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteAddress(${a.id})">Delete</button></td></tr>`).join('')}
      </table>` : `<div class="empty">No addresses yet.</div>`}

async function deleteAddress(id) { await api('/api/addresses/' + id, { method: 'DELETE' }); render(); }

async function renderWallet(content) {
  const [wallet, cashback, banks] = await Promise.all([
    api('/api/wallet'), api('/api/wallet/cashback'), api('/api/bank-accounts'),
  ]);

  const cards = [
    ['Available Balance', wallet.available, ''],
    ['Cashback', wallet.cashback, 'cashback'],
    ['Refund (total received)', wallet.totalRefunded, ''],
  ];
  if (state.user.role === 'reseller') cards.push(['Pending Balance', wallet.pending, '']);

  content.innerHTML = `
    <div class="wallet-row">
      ${cards.map(([label, amt, cls]) => `
        <div class="wallet-card ${cls}">${label}<div class="amt">${money(amt)}</div></div>
      `).join('')}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px">
      <button class="btn btn-primary" id="depositBtn">Deposit</button>
      <button class="btn btn-outline" id="withdrawBtn">Withdraw</button>
      ${wallet.cashback > 0 ? `<button class="btn btn-outline" id="convertBtn">Move Cashback → Available</button>` : ''}
    </div>

    <h3 style="margin-bottom:10px">Bank Accounts</h3>
    ${banks.length ? `<table style="margin-bottom:10px"><tr><th>Bank</th><th>Account</th><th>Name</th><th></th></tr>
      ${banks.map(b => `<tr><td>${b.bank_name}</td><td>${b.account_number}</td><td>${b.account_name || '—'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteBankAccount(${b.id})">Delete</button></td></tr>`).join('')}
      </table>` : `<p class="muted">No bank accounts added yet.</p>`}
    <button class="btn btn-outline btn-sm" id="addBankBtn" style="margin-bottom:24px">+ Add Bank Account</button>

    <h3 style="margin-bottom:10px">Security Code</h3>
    <p class="muted" style="margin-bottom:10px">A 5-digit code you'll enter to confirm every withdrawal.</p>
    <button class="btn btn-outline btn-sm" id="secCodeBtn">${wallet.securityCodeSet ? 'Change Security Code' : 'Set Security Code'}</button>

    <h3 style="margin-top:26px">Cashback History</h3>
    ${cashback.all.length ? `<table><tr><th>Amount</th><th>Status</th><th>Date</th></tr>
      ${cashback.all.map(c => `<tr><td>${money(c.amount)}</td><td><span class="badge ${c.status}">${c.status}</span></td><td>${new Date(c.created_at).toLocaleDateString()}</td></tr>`).join('')}
      </table>` : `<p class="muted">No cashback yet.</p>`}
    <div id="walletModalHolder"></div>
  `;

  document.getElementById('depositBtn').onclick = () => openDepositModal();
  document.getElementById('withdrawBtn').onclick = () => openWithdrawModal(banks, wallet.available, wallet.securityCodeSet);
  document.getElementById('addBankBtn').onclick = () => openAddBankModal();
  document.getElementById('secCodeBtn').onclick = () => openSecurityCodeModal(wallet.securityCodeSet);
  const cb = document.getElementById('convertBtn');
  if (cb) cb.onclick = async () => {
    try { await api('/api/wallet/cashback/convert', { method: 'POST' }); render(); }
    catch (err) { showToast(err.message); }
  };
}

function walletModal(html) {
  const existing = document.getElementById('walletModalHolder');
  const overlayHtml = `<div class="overlay" onclick="if(event.target===this) this.remove()"><div class="modal">${html}</div></div>`;
  if (existing) {
    existing.innerHTML = overlayHtml;
  } else {
    document.querySelectorAll('.overlay.global-modal').forEach(el => el.remove());
    const div = document.createElement('div');
    div.innerHTML = overlayHtml;
    div.firstElementChild.classList.add('global-modal');
    document.body.appendChild(div.firstElementChild);
  }
}

function openDepositModal() {
  walletModal(`
    <h3>Deposit into Wallet</h3>
    <p class="muted">You'll be taken to Flutterwave's secure checkout to pay by card, bank transfer, or mobile money.</p>
    <div class="field"><label>Amount (GHS)</label><input id="depAmount" type="number" min="1"></div>
    <button class="btn btn-primary" id="depGo">Continue to Payment</button>
  `);
  document.getElementById('depGo').onclick = async () => {
    try {
      const { link } = await api('/api/wallet/deposit/initiate', { method: 'POST', body: JSON.stringify({
        amount: document.getElementById('depAmount').value,
      })});
      window.location.href = link;
    } catch (err) { showToast(err.message); }
  };
}

function openWithdrawModal(banks, available, securityCodeSet) {
  if (!banks.length) {
    walletModal(`<h3>Withdraw</h3><p class="muted">Add a bank account first before you can withdraw.</p>
      <button class="btn btn-outline btn-sm" onclick="document.querySelector('.overlay').remove()">Close</button>`);
    return;
  }
  if (!securityCodeSet) {
    walletModal(`<h3>Withdraw</h3><p class="muted">Please set your 5-digit security code first (see Security Code section).</p>
      <button class="btn btn-outline btn-sm" onclick="document.querySelector('.overlay').remove()">Close</button>`);
    return;
  }
  walletModal(`
    <h3>Withdraw</h3>
    <p class="muted">Available: ${money(available)}</p>
    <div class="field"><label>Bank Account</label>
      <select id="wdBank">${banks.map(b => `<option value="${b.id}">${b.bank_name} — ${b.account_number} (${b.account_name || ''})</option>`).join('')}</select>
    </div>
    <div class="field"><label>Amount (GHS)</label><input id="wdAmount" type="number" min="1"></div>
    <div class="field"><label>Security Code (5 digits)</label><input id="wdCode" type="password" inputmode="numeric" maxlength="5"></div>
    <button class="btn btn-primary" id="wdGo">Withdraw</button>
  `);
  document.getElementById('wdGo').onclick = async () => {
    try {
      await api('/api/wallet/withdraw', { method: 'POST', body: JSON.stringify({
        bank_account_id: document.getElementById('wdBank').value,
        amount: document.getElementById('wdAmount').value,
        security_code: document.getElementById('wdCode').value,
      })});
      document.querySelector('.overlay').remove();
      render();
    } catch (err) { showToast(err.message); }
  };
}

async function openAddBankModal() {
  walletModal(`<h3>Add Bank Account</h3><p class="muted">Loading banks...</p>`);
  try {
    const banks = await api('/api/banks');
    walletModal(`
      <h3>Add Bank Account</h3>
      <div class="field"><label>Bank</label>
        <select id="newBankSelect">${banks.map(b => `<option value="${b.code}" data-name="${b.name}">${b.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Account Number</label><input id="newBankAccNo"></div>
      <button class="btn btn-primary" id="newBankGo">Verify &amp; Save</button>
    `);
    document.getElementById('newBankGo').onclick = async () => {
      try {
        const sel = document.getElementById('newBankSelect');
        await api('/api/bank-accounts', { method: 'POST', body: JSON.stringify({
          bank_code: sel.value,
          bank_name: sel.selectedOptions[0].dataset.name,
          account_number: document.getElementById('newBankAccNo').value,
        })});
        document.querySelector('.overlay').remove();
        render();
      } catch (err) { showToast(err.message); }
    };
  } catch (err) {
    walletModal(`<h3>Add Bank Account</h3><div class="error-box">${err.message}</div>`);
  }
}

async function deleteBankAccount(id) { await api('/api/bank-accounts/' + id, { method: 'DELETE' }); render(); }

function openSecurityCodeModal(isSet) {
  walletModal(`
    <h3>${isSet ? 'Change' : 'Set'} Security Code</h3>
    <p class="muted">Exactly 5 digits. You'll need this to confirm every withdrawal.</p>
    ${isSet ? `<div class="field"><label>Current Code</label><input id="secCurrent" type="password" inputmode="numeric" maxlength="5"></div>` : ''}
    <div class="field"><label>New Code</label><input id="secNew" type="password" inputmode="numeric" maxlength="5"></div>
    <div class="field"><label>Confirm New Code</label><input id="secConfirm" type="password" inputmode="numeric" maxlength="5"></div>
    <button class="btn btn-primary" id="secGo">Save</button>
  `);
  document.getElementById('secGo').onclick = async () => {
    const code = document.getElementById('secNew').value;
    const confirmCode = document.getElementById('secConfirm').value;
    if (code !== confirmCode) return showToast('The two codes do not match.');
    try {
      await api('/api/wallet/security-code', { method: 'POST', body: JSON.stringify({
        code,
        current_code: isSet ? document.getElementById('secCurrent').value : undefined,
      })});
      document.querySelector('.overlay').remove();
      render();
    } catch (err) { showToast(err.message); }
  };
}

  const plans = await api('/api/plans?type=' + state.user.role);
  content.innerHTML = `
    <div class="wallet-row">
      <div class="wallet-card ${sub.status !== 'active' ? '' : ''}" style="${sub.status !== 'active' ? 'background:var(--red)' : ''}">
        ${sub.name} Plan<div class="amt">${money(sub.price)}/mo</div>
      </div>
    </div>
    <p><strong>Status:</strong> <span class="badge ${sub.status === 'active' ? 'active' : 'rejected'}">${sub.status}</span></p>
    <p><strong>Renews:</strong> ${new Date(sub.renews_at).toLocaleDateString()}</p>
    ${sub.product_limit ? `<p><strong>Products:</strong> ${sub.productCount ?? 0} / ${sub.product_limit}</p>` : sub.productCount != null ? `<p><strong>Products:</strong> ${sub.productCount} (unlimited)</p>` : ''}
    <p class="muted">${sub.price_cap ? `Items must be priced at or under ${money(sub.price_cap)}.` : 'No price limit on items.'}</p>
    ${sub.status !== 'active' ? `<div class="error-box">Your plan is suspended — renew below to unlock your dashboard again.</div>` : ''}
    ${plans.length > 1 ? `
      <h4 style="margin:14px 0 8px">Keep or change plan</h4>
      ${plans.map(p => `
        <label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
          <input type="radio" name="subPlanPick" value="${p.code}" ${p.code === sub.code ? 'checked' : ''}>
          <span style="flex:1"><strong>${p.name}</strong> — ${money(p.price)}/mo
            <div class="muted">${p.product_limit ? p.product_limit + ' products max' : 'Unlimited products'}${p.price_cap ? `, items up to ${money(p.price_cap)}` : ', no price limit'}</div>
          </span>
        </label>`).join('')}
    ` : ''}
    <div class="field" style="max-width:300px;margin-top:10px"><label>Coupon Code (optional)</label><input id="subCoupon" placeholder="e.g. RENEW10"></div>
    <button class="btn btn-primary" id="subRenewBtn">Renew Now</button>
  `;
  document.getElementById('subRenewBtn').onclick = async () => {
    const picked = document.querySelector('input[name="subPlanPick"]:checked');
    try {
      await api('/api/subscription/renew-now', { method: 'POST', body: JSON.stringify({
        plan_code: picked ? picked.value : undefined,
        coupon_code: document.getElementById('subCoupon').value.trim() || undefined,
      })});
      render();
    } catch (err) {
      if (/balance|deposit/i.test(err.message)) {
        if (await showConfirm(err.message + ' Open Deposit now?')) openDepositModal();
      } else {
        showToast(err.message);
      }
    }
  };
}

async function deleteProduct(id) { await api('/api/reseller/products/' + id, { method: 'DELETE' }); render(); }

async function approveOrder(id) {
  const days = await showPrompt('Deliver within how many days?', '7');
  if (days === null) return;
  try {
    await api(`/api/reseller/orders/${id}/approve`, { method: 'POST', body: JSON.stringify({ delivery_days: days }) });
    render();
  } catch (err) { showToast(err.message); }
}
async function rejectOrder(id) {
  const reason = await showPrompt('Reason for declining this order (shown to the customer):');
  if (reason === null) return;
  if (!(await showConfirm('Decline this order? The customer will be refunded immediately.'))) return;
  try {
    await api(`/api/reseller/orders/${id}/reject`, { method: 'POST', body: JSON.stringify({ reason }) });
    render();
  } catch (err) { showToast(err.message); }
}
async function shipOrder(id) {
  if (!(await showConfirm('Mark this order as shipped/delivered to the customer?'))) return;
  try {
    await api(`/api/reseller/orders/${id}/ship`, { method: 'POST' });
    render();
  } catch (err) { showToast(err.message); }
}

async function adminRenewFree(userId, planType) {
  const plans = await api('/api/plans?type=' + planType);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal">
      <h3>Renew (Free)</h3>
      <p class="muted">Choose a plan to renew them on — leave as-is or switch, no charge either way.</p>
      ${plans.map(p => `
        <label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
          <input type="radio" name="renewPlanPick" value="${p.code}">
          <span>${p.name} — ${money(p.price)}/mo</span>
        </label>`).join('')}
      <button class="btn btn-primary" id="renewFreeGo" style="width:100%;margin-top:10px">Renew Free</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('renewFreeGo').onclick = async () => {
    const picked = document.querySelector('input[name="renewPlanPick"]:checked');
    try {
      await api(`/api/admin/subscriptions/${userId}/renew`, { method: 'POST', body: JSON.stringify({ plan_code: picked ? picked.value : undefined }) });
      overlay.remove();
      render();
    } catch (err) { showToast(err.message); }
  };
}
async function adminDeactivateCoupon(id) {
  await api('/api/admin/coupons/' + id, { method: 'DELETE' }); render();
}

async function openAdminSupportThread(userId, app) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal">
      <h3>Message Center</h3>
      <div id="adminSupportList" style="max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px"></div>
      <div style="display:flex;gap:8px">
        <input id="adminSupportInput" placeholder="Type a reply...">
        <button class="btn btn-primary btn-sm" id="adminSupportSend">Send</button>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:10px;width:100%" onclick="this.closest('.overlay').remove()">Close</button>
    </div>`;
  document.body.appendChild(overlay);

  async function loadThread() {
    const msgs = await api('/api/admin/support/messages/' + userId);
    document.getElementById('adminSupportList').innerHTML = msgs.length ? msgs.map(m => `
      <div class="chat-msg ${m.sender_role === 'admin' ? 'me' : 'bot'}"><strong>${m.sender_role === 'admin' ? 'You' : 'User'}:</strong> ${m.message}</div>
    `).join('') : `<p class="muted">No messages yet.</p>`;
  }
  await loadThread();
  document.getElementById('adminSupportSend').onclick = async () => {
    const input = document.getElementById('adminSupportInput');
    if (!input.value.trim()) return;
    try {
      await api('/api/admin/support/messages/' + userId, { method: 'POST', body: JSON.stringify({ message: input.value }) });
      input.value = '';
      await loadThread();
    } catch (err) { showToast(err.message); }
  };
}

async function renderMessageCenter(content) {
  content.innerHTML = `
    <h3 style="margin-bottom:10px">Message Center</h3>
    <p class="muted" style="margin-bottom:10px">Talk directly with Admin.</p>
    <div id="msgCenterList" style="max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px"></div>
    <div style="display:flex;gap:8px">
      <input id="msgCenterInput" placeholder="Type a message...">
      <button class="btn btn-primary btn-sm" id="msgCenterSend">Send</button>
    </div>
  `;
  async function loadMsgs() {
    const msgs = await api('/api/support/messages');
    document.getElementById('msgCenterList').innerHTML = msgs.length ? msgs.map(m => `
      <div class="chat-msg ${m.sender_role === 'user' ? 'me' : 'bot'}"><strong>${m.sender_role === 'user' ? 'You' : 'Admin'}:</strong> ${m.message}</div>
    `).join('') : `<p class="muted">No messages yet — send one below.</p>`;
    document.getElementById('msgCenterList').scrollTop = 999999;
  }
  await loadMsgs();
  refreshMsgBadge();
  document.getElementById('msgCenterSend').onclick = async () => {
    const input = document.getElementById('msgCenterInput');
    if (!input.value.trim()) return;
    try {
      await api('/api/support/messages', { method: 'POST', body: JSON.stringify({ message: input.value }) });
      input.value = '';
      await loadMsgs();
    } catch (err) { showToast(err.message); }
  };
}

/* ---------------- Chat widget ---------------- */
const chatBubble = document.getElementById('chatBubble');
const chatWindow = document.getElementById('chatWindow');
const chatBody = document.getElementById('chatBody');
chatBubble.onclick = () => {
  chatWindow.classList.toggle('open');
  if (!chatBody.childElementCount) addChatMsg('bot', "Hi! I'm the MakolaOnline helper. Ask me about deposits, orders, or becoming a vendor.");
};
function addChatMsg(who, text) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + who;
  div.textContent = text;
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}
document.getElementById('chatSend').onclick = sendChat;
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addChatMsg('me', text);
  input.value = '';
  const answer = askBot(text);
  setTimeout(() => {
    if (answer) {
      addChatMsg('bot', answer);
    } else {
      addChatMsg('bot', "I'm not sure about that — want me to send this to Admin so a real person can help?");
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-sm';
      btn.style.alignSelf = 'flex-start';
      btn.textContent = 'Send to Admin';
      btn.onclick = async () => {
        if (!state.user) { chatWindow.classList.remove('open'); go('login'); return; }
        try {
          await api('/api/support/messages', { method: 'POST', body: JSON.stringify({ message: text }) });
          addChatMsg('bot', "Sent! Admin will reply in your Message Center (Profile → Message Center).");
          btn.remove();
        } catch (err) { addChatMsg('bot', err.message); }
      };
      chatBody.appendChild(btn);
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  }, 400);
}
