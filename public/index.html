<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakolaOnline.com — Buy, Sell &amp; Work in Ghana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FCD116;
  --green:#006B3F;
  --green-dark:#00502F;
  --red:#CE1126;
  --white:#FFFFFF;
  --ink:#1A1A1A;
  --ink-soft:#5B5B5B;
  --bg:#FAFAF8;
  --surface:#FFFFFF;
  --surface-2:#F1EFE7;
  --line:#E6E3DA;
  --radius:6px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;font-weight:600;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}

/* ---------- Header ---------- */
header.topbar{background:var(--green);border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:50;}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
.logo{color:var(--white);font-size:22px;font-weight:700;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px;}
.logo .dot{width:10px;height:10px;background:var(--yellow);border-radius:50%;}
.cart-btn{position:relative;background:var(--yellow);color:var(--green-dark);border:none;padding:8px 14px;border-radius:var(--radius);font-weight:700;font-size:14px;}
.cart-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}

/* ---------- Bottom Navigation ---------- */
nav.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--green);border-top:3px solid var(--yellow);
  display:flex;justify-content:space-around;padding:6px 4px 8px;}
nav.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.75);
  font-size:11px;font-weight:600;padding:4px 2px;border-radius:8px;min-width:0;}
nav.bottomnav a .ic{font-size:19px;line-height:1;}
nav.bottomnav a.active{color:var(--yellow);}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:0 auto;padding:28px 20px 24px;min-height:60vh;}
.section-title{font-size:22px;margin-bottom:14px;}
.muted{color:var(--ink-soft);font-size:14px;}

/* ---------- Buttons ---------- */
.btn{display:inline-block;border:none;padding:11px 20px;border-radius:var(--radius);font-weight:700;font-size:14px;}
.btn-primary{background:var(--yellow);color:var(--green-dark);}
.btn-primary:hover{background:#ecc300;}
.btn-outline{background:transparent;border:2px solid var(--green);color:var(--green);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:4px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Banner slider ---------- */
.banner{position:relative;border-radius:10px;overflow:hidden;height:220px;background:linear-gradient(120deg,var(--green),var(--green-dark));margin-bottom:26px;}
.banner img{width:100%;height:100%;object-fit:cover;}
.banner-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
.banner-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);}
.banner-dots span.on{background:var(--yellow);}
.banner-empty{color:#fff;display:flex;align-items:center;justify-content:center;height:100%;font-family:'Space Grotesk';font-size:20px;}

/* ---------- Search (wraps on narrow screens instead of overflowing) ---------- */
.searchbar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.searchbar input{flex:2 1 160px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:var(--surface);color:var(--ink);}
.searchbar select{flex:1 1 130px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:var(--surface);color:var(--ink);}
.searchbar button{flex:1 1 100px;}

/* ---------- Grid / Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
.card .thumb{height:140px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px;}
.card .thumb img{width:100%;height:100%;object-fit:cover;}
.card .body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px;}
.card h4{font-size:15px;color:var(--ink);}
.price{color:var(--green);font-weight:700;font-family:'Space Grotesk';font-size:16px;}
.card .body .muted{font-size:12px;}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px;}

.job-card{border-top:4px solid var(--red);}
.job-card .salary{color:var(--red);font-weight:700;}

/* ---------- Forms ---------- */
.form-box{max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px;}
.form-box h2{margin-bottom:4px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink);}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink);}
.field textarea{resize:vertical;min-height:70px;}
.error-box{background:#FDEBEC;color:var(--red);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:12px;}
.ok-box{background:#E8F5EE;color:var(--green-dark);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:12px;}
.switch-link{text-align:center;margin-top:14px;font-size:13px;}

/* ---------- Profile: header card + menu list ---------- */
.profile-header{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:10px;padding:18px;margin-bottom:18px;}
.avatar-circle{width:52px;height:52px;border-radius:50%;background:var(--yellow);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;font-family:'Space Grotesk';flex-shrink:0;}
.profile-header .pname{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.profile-header .pemail{color:var(--ink-soft);font-size:13px;margin-top:2px;}
.menu-list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.menu-item:last-child{border-bottom:none;}
.menu-item:active{background:var(--surface-2);}
.menu-item .mi-icon{font-size:20px;width:24px;text-align:center;flex-shrink:0;}
.menu-item .mi-label{flex:1;font-size:14px;font-weight:600;}
.menu-item .mi-chevron{color:var(--ink-soft);font-size:16px;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}

/* ---------- Tabs (Admin) ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px;}
.tabs button{background:none;border:none;padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);border-bottom:3px solid transparent;}
.tabs button.active{color:var(--green);border-color:var(--green);}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:13px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);}
th{background:var(--surface-2);font-family:'Space Grotesk';font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);}
tr:last-child td{border-bottom:none;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.pending{background:#FFF3CD;color:#8a6d00;}
.badge.approved,.badge.completed,.badge.active{background:#E8F5EE;color:var(--green-dark);}
.badge.rejected,.badge.banned{background:#FDEBEC;color:var(--red);}
.badge.processing{background:#E7F0FF;color:#1d4ed8;}
.badge.shipped{background:#EFE7FF;color:#6d28d9;}

.wallet-row{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.wallet-card{flex:1;min-width:200px;background:var(--green);color:#fff;border-radius:10px;padding:20px;}
.wallet-card.cashback{background:var(--yellow);color:var(--green-dark);}
.wallet-card .amt{font-family:'Space Grotesk';font-size:26px;margin-top:6px;}

.empty{text-align:center;padding:50px 10px;color:var(--ink-soft);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border-radius:10px;max-width:460px;width:100%;max-height:86vh;overflow:auto;padding:22px;}
.modal h3{margin-bottom:14px;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);}

/* ---------- Help chat widget ---------- */
.chat-bubble{position:fixed;bottom:78px;right:16px;background:var(--green);color:#fff;width:52px;height:52px;border-radius:50%;border:none;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:80;}
.chat-window{position:fixed;bottom:138px;right:16px;width:280px;max-height:400px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:80;}
.chat-window.open{display:flex;}
.chat-head{background:var(--green);color:#fff;padding:12px 14px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;}
.chat-body{flex:1;overflow:auto;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:8px;}
.chat-msg{padding:8px 10px;border-radius:8px;max-width:85%;}
.chat-msg.bot{background:var(--surface-2);color:var(--ink);align-self:flex-start;}
.chat-msg.me{background:var(--yellow);color:var(--green-dark);align-self:flex-end;}
.chat-foot{display:flex;border-top:1px solid var(--line);}
.chat-foot input{flex:1;border:none;padding:10px;font-size:13px;background:var(--surface);color:var(--ink);}
.chat-foot button{background:var(--green);color:#fff;border:none;padding:0 14px;font-weight:700;}

footer.sitefoot{text-align:center;padding:24px;color:var(--ink-soft);font-size:12px;border-top:1px solid var(--line);}
footer.sitefoot a{color:var(--green);font-weight:600;}

.bell-dropdown{position:absolute;top:44px;right:0;width:280px;max-height:340px;overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:90;}
.bell-item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;}
.bell-item:last-child{border-bottom:none;}
.bell-item.unread{background:#FFF8E1;}
.bell-item .bt{color:var(--ink-soft);font-size:11px;margin-top:3px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="dot"></span>MakolaOnline</div>
    <div style="display:flex;align-items:center;gap:8px;position:relative">
      <button class="cart-btn" id="bellBtn" style="background:transparent;color:#fff;font-size:18px;padding:8px">🔔<span class="cart-badge" id="bellBadge" style="display:none">0</span></button>
      <div id="bellDropdown"></div>
      <button class="cart-btn" id="cartBtn">Cart <span id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="sitefoot">
  &copy; 2026 MakolaOnline.com — Ghana's Marketplace
</footer>

<button class="chat-bubble" id="chatBubble">&#128172;</button>
<div class="chat-window" id="chatWindow">
  <div class="chat-head">MakolaOnline Help</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-foot">
    <input id="chatInput" placeholder="Type your question...">
    <button id="chatSend">Send</button>
  </div>
</div>

<nav class="bottomnav" id="bottomNav"></nav>

<script>
/* ============================================================
   MakolaOnline.com — single-file SPA frontend
   Talks to the Express/PostgreSQL API defined in server.js
   ============================================================ */

const state = {
  token: localStorage.getItem('mko_token') || null,
  user: null,
  page: 'home',
  depositFlash: null,
  cart: JSON.parse(localStorage.getItem('mko_cart') || '[]'),
};

function parseHash() {
  const raw = location.hash.replace('#', '') || 'home';
  const [page, queryStr] = raw.split('?');
  return { page: page || 'home', params: new URLSearchParams(queryStr || '') };
}
const initial = parseHash();
state.page = initial.page;
if (initial.params.get('deposit')) state.depositFlash = initial.params.get('deposit');

/* ---------------- API helper ---------------- */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

function saveCart() { localStorage.setItem('mko_cart', JSON.stringify(state.cart)); renderCartCount(); }
function renderCartCount() { document.getElementById('cartCount').textContent = state.cart.reduce((s, i) => s + i.qty, 0); }

function money(n) { return '₵' + Number(n || 0).toFixed(2); }

function go(page) { location.hash = page; }

window.addEventListener('hashchange', () => {
  const { page, params } = parseHash();
  state.page = page;
  if (params.get('deposit')) state.depositFlash = params.get('deposit');
  render();
});

/* ---------------- Nav (bottom bar) ---------------- */
function renderNav() {
  const items = [
    ['home', '🏠', 'HOME'], ['services', '💼', 'SERVICES'], ['vendor', '🏪', 'VENDOR'],
    ['orders', '📦', 'ORDER'], ['profile', '👤', 'PROFILE'],
  ];
  // Admin Panel now lives inside the Profile menu, not the bottom bar.
  const nav = document.getElementById('bottomNav');
  nav.innerHTML = items.map(([id, icon, label]) =>
    `<a href="#${id}" class="${state.page === id ? 'active' : ''}"><span class="ic">${icon}</span>${label}</a>`
  ).join('');
}

function logout() {
  state.token = null; state.user = null;
  localStorage.removeItem('mko_token');
  go('home');
}

/* ---------------- Root render ---------------- */
async function loadUser() {
  if (!state.token) { state.user = null; return; }
  try { state.user = await api('/api/profile'); }
  catch { state.token = null; localStorage.removeItem('mko_token'); state.user = null; }
}

async function render() {
  renderNav();
  renderCartCount();
  refreshBell();
  const app = document.getElementById('app');
  app.innerHTML = '<p class="muted">Loading...</p>';

  const authPages = ['vendor', 'orders', 'profile', 'admin'];
  if (authPages.includes(state.page) && !state.user) { go('login'); return; }

  if (state.page === 'profile' && state.depositFlash) profileTab = 'wallet';

  try {
    switch (state.page) {
      case 'home': await renderHome(app); break;
      case 'services': await renderServices(app); break;
      case 'vendor': await renderVendor(app); break;
      case 'orders': await renderOrders(app); break;
      case 'profile': await renderProfile(app); break;
      case 'admin': await renderAdmin(app); break;
      case 'login': renderLogin(app); break;
      case 'register': renderRegister(app); break;
      case 'privacy': renderPrivacy(app); break;
      case 'help': renderHelp(app); break;
      default: await renderHome(app); break;
    }
    if (state.depositFlash) {
      const banner = document.createElement('div');
      banner.className = state.depositFlash === 'success' ? 'ok-box' : 'error-box';
      banner.textContent = state.depositFlash === 'success'
        ? 'Deposit successful — your Available Balance has been updated.'
        : 'Deposit was not completed.';
      app.prepend(banner);
      state.depositFlash = null;
    }
  } catch (err) {
    app.innerHTML = `<div class="error-box">${err.message}<br><span class="muted">Make sure the Node.js server (npm run dev) is running, and that you're opening the site via http://localhost:5000 — not by opening the file directly.</span></div>`;
  }
}

/* ================= HOME ================= */
async function renderHome(app) {
  const [banners, products] = await Promise.all([
    api('/api/banners').catch(() => []),
    api('/api/products'),
  ]);

  app.innerHTML = `
    <div class="banner" id="bannerBox">
      ${banners.length ? banners.map((b, i) => `
        <a href="${b.link || '#'}" style="display:${i === 0 ? 'block' : 'none'};height:100%">
          <img src="${b.image_url}" alt="banner">
        </a>`).join('') : `<div class="banner-empty">Welcome to MakolaOnline — Buy &amp; Sell across Ghana 🇬🇭</div>`}
      ${banners.length > 1 ? `<div class="banner-dots">${banners.map((_, i) => `<span class="${i === 0 ? 'on' : ''}"></span>`).join('')}</div>` : ''}
    </div>
    <div class="searchbar">
      <input id="searchInput" placeholder="Search products e.g. rice, shoes, phone...">
      <select id="categorySelect">
        <option value="">All Categories</option>
        <option>Electronics</option><option>Fashion</option><option>Food &amp; Groceries</option>
        <option>Beauty</option><option>Home &amp; Living</option><option>Other</option>
      </select>
      <button class="btn btn-primary" id="searchBtn">Search</button>
    </div>
    <h2 class="section-title">Products on MakolaOnline</h2>
    <div class="grid" id="productGrid"></div>
  `;

  if (banners.length > 1) {
    let idx = 0;
    setInterval(() => {
      const slides = document.querySelectorAll('#bannerBox a');
      const dots = document.querySelectorAll('.banner-dots span');
      if (!slides.length) return;
      slides[idx].style.display = 'none'; dots[idx].classList.remove('on');
      idx = (idx + 1) % slides.length;
      slides[idx].style.display = 'block'; dots[idx].classList.add('on');
    }, 4000);
  }

  fillProductGrid(products);

  document.getElementById('searchBtn').onclick = async () => {
    const search = document.getElementById('searchInput').value;
    const category = document.getElementById('categorySelect').value;
    const q = new URLSearchParams({ ...(search && { search }), ...(category && { category }) });
    fillProductGrid(await api('/api/products?' + q.toString()));
  };
}

function fillProductGrid(products) {
  const grid = document.getElementById('productGrid');
  if (!products.length) { grid.innerHTML = `<div class="empty">No products available right now. Check back once some are approved.</div>`; return; }
  grid.innerHTML = products.map(p => `
    <div class="card">
      <div class="thumb">${p.image ? `<img src="${p.image}" alt="${p.name}">` : '🛍️'}</div>
      <div class="body">
        <h4>${p.name}</h4>
        <div class="muted">${p.category || 'General'} · by ${p.reseller_name}</div>
        <div class="price">${money(p.price)}</div>
        <div class="row">
          <button class="btn btn-outline btn-sm" onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price})">Add to Cart</button>
        </div>
      </div>
    </div>
  `).join('');
}

function addToCart(id, name, price) {
  const existing = state.cart.find(i => i.product_id === id);
  if (existing) existing.qty += 1;
  else state.cart.push({ product_id: id, name, price, qty: 1 });
  saveCart();
}

/* ================= SERVICES (Jobs) ================= */
async function renderServices(app) {
  const jobs = await api('/api/jobs');
  app.innerHTML = `
    <h2 class="section-title">Jobs on MakolaOnline</h2>
    <div class="grid" id="jobGrid"></div>
  `;
  const grid = document.getElementById('jobGrid');
  if (!jobs.length) { grid.innerHTML = `<div class="empty">No jobs available right now.</div>`; return; }
  grid.innerHTML = jobs.map(j => `
    <div class="card job-card">
      <div class="body">
        <h4>${j.title}</h4>
        <div class="muted">${j.location || 'Ghana'} · by ${j.employer_name}</div>
        <p class="muted">${(j.description || '').slice(0, 100)}${(j.description || '').length > 100 ? '…' : ''}</p>
        <div class="salary">${j.salary || 'Negotiable'}</div>
      </div>
    </div>
  `).join('');
}

/* ================= MKO-VENDOR ================= */
async function renderVendor(app) {
  const apps = await api('/api/vendor/status');
  const approvedReseller = state.user.role === 'reseller';
  const approvedEmployer = state.user.role === 'employer';
  const pendingReseller = apps.find(a => a.type === 'reseller' && a.status === 'pending');
  const pendingEmployer = apps.find(a => a.type === 'employer' && a.status === 'pending');

  app.innerHTML = `
    <h2 class="section-title">MKO-Vendor</h2>
    <p class="muted">Become a Reseller (sell products) or an Employer (post jobs) on MakolaOnline.</p>
    <div class="wallet-row">
      <div class="form-box" style="flex:1">
        <h3>Reseller</h3>
        ${approvedReseller ? `<p class="ok-box">You've been approved as a Reseller ✔️</p><a href="#profile" class="btn btn-primary">Go to your Dashboard</a>`
          : pendingReseller ? `<p class="error-box">Your application is pending Admin approval.</p>`
          : `<button class="btn btn-primary" id="applyReseller">Apply as Reseller</button>`}
      </div>
      <div class="form-box" style="flex:1">
        <h3>Employer</h3>
        ${approvedEmployer ? `<p class="ok-box">You've been approved as an Employer ✔️</p><a href="#profile" class="btn btn-primary">Go to your Dashboard</a>`
          : pendingEmployer ? `<p class="error-box">Your application is pending Admin approval.</p>`
          : `<button class="btn btn-primary" id="applyEmployer">Apply as Employer</button>`}
      </div>
    </div>
    <div id="vendorModalHolder"></div>
  `;
  const rBtn = document.getElementById('applyReseller');
  const eBtn = document.getElementById('applyEmployer');
  if (rBtn) rBtn.onclick = () => openPlanPicker('reseller');
  if (eBtn) eBtn.onclick = () => openPlanPicker('employer');
}

/* ================= NOTIFICATIONS (bell) ================= */
async function refreshBell() {
  if (!state.user) { document.getElementById('bellBadge').style.display = 'none'; return; }
  try {
    const notifs = await api('/api/notifications');
    const unread = notifs.filter(n => !n.is_read).length;
    const badge = document.getElementById('bellBadge');
    badge.style.display = unread ? 'flex' : 'none';
    badge.textContent = unread;
    return notifs;
  } catch { return []; }
}
document.getElementById('bellBtn').onclick = async () => {
  const holder = document.getElementById('bellDropdown');
  if (holder.innerHTML) { holder.innerHTML = ''; return; }
  if (!state.user) { go('login'); return; }
  const notifs = await refreshBell();
  holder.innerHTML = `<div class="bell-dropdown">
    ${notifs.length ? notifs.map(n => `
      <div class="bell-item ${n.is_read ? '' : 'unread'}" data-nid="${n.id}">
        ${n.message}<div class="bt">${new Date(n.created_at).toLocaleString()}</div>
      </div>`).join('') : `<div class="bell-item muted">No notifications yet.</div>`}
  </div>`;
  holder.querySelectorAll('[data-nid]').forEach(el => el.onclick = async () => {
    await api('/api/notifications/' + el.dataset.nid + '/read', { method: 'POST' });
    el.classList.remove('unread');
    refreshBell();
  });
};
document.addEventListener('click', (e) => {
  const holder = document.getElementById('bellDropdown');
  if (holder && holder.innerHTML && !e.target.closest('#bellDropdown') && !e.target.closest('#bellBtn')) holder.innerHTML = '';
});

document.getElementById('cartBtn').onclick = () => {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  const total = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
  overlay.innerHTML = `
    <div class="modal">
      <h3>Your Cart</h3>
      ${state.cart.length ? `
        <table>
          <tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr>
          ${state.cart.map((i, idx) => `
            <tr><td>${i.name}</td><td>${i.qty}</td><td>${money(i.price * i.qty)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="removeFromCart(${idx})">✕</button></td></tr>`).join('')}
        </table>
        <p style="margin:12px 0;font-weight:700">Total: ${money(total)}</p>
        <div class="field"><label>Coupon Code (optional)</label><input id="cartCoupon" placeholder="e.g. SAVE10"></div>
        <button class="btn btn-primary" id="checkoutBtn">Checkout (pay from Wallet)</button>
      ` : `<p class="muted">Your cart is empty.</p>`}
      <button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="this.closest('.overlay').remove()">Close</button>
    </div>`;
  document.body.appendChild(overlay);
  const cb = document.getElementById('checkoutBtn');
  if (cb) cb.onclick = async () => {
    if (!state.user) { overlay.remove(); go('login'); return; }
    try {
      await api('/api/orders', {
        method: 'POST',
        body: JSON.stringify({
          items: state.cart.map(i => ({ product_id: i.product_id, qty: i.qty })),
          coupon_code: document.getElementById('cartCoupon').value.trim() || undefined,
        }),
      });
      state.cart = []; saveCart(); overlay.remove(); go('orders');
    } catch (err) { alert(err.message); }
  };
};
function removeFromCart(idx) { state.cart.splice(idx, 1); saveCart(); document.getElementById('cartBtn').click(); document.querySelector('.overlay')?.remove(); document.getElementById('cartBtn').onclick(); }

let profileTab = null; // null = show the main menu list
async function renderProfile(app) {
  if (!profileTab) {
    const items = [
      ['history', '📜', 'Order History'],
    ];
    if (state.user.role === 'reseller') items.push(['reseller', '🏬', 'Reseller Dashboard', 'Active']);
    if (state.user.role === 'employer') items.push(['employer', '🧰', 'Employer Dashboard', 'Active']);
    if (state.user.role === 'reseller' || state.user.role === 'employer') items.push(['subscription', '📅', 'My Subscription']);
    items.push(['addresses', '📍', 'Delivery Addresses']);
    items.push(['wallet', '👛', 'Wallet & Cashback']);
    if (state.user.isAdmin) items.push(['admin-link', '🛠️', 'Admin Panel', 'Owner only']);
    items.push(['privacy-link', '📄', 'Privacy Policy & Terms']);
    items.push(['help-link', '🆘', 'Help & Support']);
    items.push(['logout-link', '🚪', 'Log Out']);

    app.innerHTML = `
      <div class="profile-header">
        <div class="avatar-circle">${state.user.name.charAt(0).toUpperCase()}</div>
        <div>
          <div class="pname">${state.user.name} <span class="badge ${state.user.status}">${state.user.status}</span></div>
          <div class="pemail">${state.user.email}</div>
        </div>
      </div>
      <div class="menu-list">
        ${items.map(([id, icon, label, badge]) => `
          <div class="menu-item" data-mi="${id}">
            <span class="mi-icon">${icon}</span>
            <span class="mi-label">${label}</span>
            ${badge ? `<span class="badge active">${badge}</span>` : ''}
            <span class="mi-chevron">›</span>
          </div>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('[data-mi]').forEach(el => el.onclick = () => {
      const id = el.dataset.mi;
      if (id === 'admin-link') return go('admin');
      if (id === 'privacy-link') return go('privacy');
      if (id === 'help-link') return go('help');
      if (id === 'logout-link') return logout();
      profileTab = id;
      renderProfile(app);
    });
    return;
  }

  const titles = {
    history: 'Order History', reseller: 'Reseller Dashboard', employer: 'Employer Dashboard',
    addresses: 'Delivery Addresses', wallet: 'Wallet & Cashback', subscription: 'My Subscription',
  };
  app.innerHTML = `
    <div class="back-row">
      <button class="btn btn-outline btn-sm" id="backToMenu">← Back</button>
      <h2 class="section-title" style="margin:0">${titles[profileTab] || ''}</h2>
    </div>
    <div id="profileContent"></div>
  `;
  document.getElementById('backToMenu').onclick = () => { profileTab = null; renderProfile(app); };

  const content = document.getElementById('profileContent');
  if (profileTab === 'history') {
    const hist = await api('/api/history');
    content.innerHTML = hist.length ? `
      <table><tr><th>Action</th><th>Details</th><th>Date</th></tr>
      ${hist.map(h => `<tr><td>${h.action}</td><td>${h.details || '—'}</td><td>${new Date(h.created_at).toLocaleString()}</td></tr>`).join('')}
      </table>` : `<div class="empty">No history yet.</div>`;
  } else if (profileTab === 'addresses') {
    await renderAddresses(content);
  } else if (profileTab === 'wallet') {
    await renderWallet(content);
  } else if (profileTab === 'reseller') {
    await renderResellerDashboard(content);
  } else if (profileTab === 'employer') {
    await renderEmployerDashboard(content);
  } else if (profileTab === 'subscription') {
    await renderSubscriptionTab(content);
  }
}

async function renderWallet(content) {
  const [wallet, cashback, banks] = await Promise.all([
    api('/api/wallet'), api('/api/wallet/cashback'), api('/api/bank-accounts'),
  ]);

  const cards = [
    ['Available Balance', wallet.available, ''],
    ['Cashback', wallet.cashback, 'cashback'],
    ['Refund (total received)', wallet.totalRefunded, ''],
  ];
  if (state.user.role === 'reseller') cards.push(['Pending Balance', wallet.pending, '']);

  content.innerHTML = `
    <div class="wallet-row">
      ${cards.map(([label, amt, cls]) => `
        <div class="wallet-card ${cls}">${label}<div class="amt">${money(amt)}</div></div>
      `).join('')}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px">
      <button class="btn btn-primary" id="depositBtn">Deposit</button>
      <button class="btn btn-outline" id="withdrawBtn">Withdraw</button>
      ${wallet.cashback > 0 ? `<button class="btn btn-outline" id="convertBtn">Move Cashback → Available</button>` : ''}
    </div>

    <h3 style="margin-bottom:10px">Bank Accounts</h3>
    ${banks.length ? `<table style="margin-bottom:10px"><tr><th>Bank</th><th>Account</th><th>Name</th><th></th></tr>
      ${banks.map(b => `<tr><td>${b.bank_name}</td><td>${b.account_number}</td><td>${b.account_name || '—'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteBankAccount(${b.id})">Delete</button></td></tr>`).join('')}
      </table>` : `<p class="muted">No bank accounts added yet.</p>`}
    <button class="btn btn-outline btn-sm" id="addBankBtn" style="margin-bottom:24px">+ Add Bank Account</button>

    <h3 style="margin-bottom:10px">Security Code</h3>
    <p class="muted" style="margin-bottom:10px">A 5-digit code you'll enter to confirm every withdrawal.</p>
    <button class="btn btn-outline btn-sm" id="secCodeBtn">${wallet.securityCodeSet ? 'Change Security Code' : 'Set Security Code'}</button>

    <h3 style="margin-top:26px">Cashback History</h3>
    ${cashback.all.length ? `<table><tr><th>Amount</th><th>Status</th><th>Date</th></tr>
      ${cashback.all.map(c => `<tr><td>${money(c.amount)}</td><td><span class="badge ${c.status}">${c.status}</span></td><td>${new Date(c.created_at).toLocaleDateString()}</td></tr>`).join('')}
      </table>` : `<p class="muted">No cashback yet.</p>`}
    <div id="walletModalHolder"></div>
  `;

  document.getElementById('depositBtn').onclick = () => openDepositModal();
  document.getElementById('withdrawBtn').onclick = () => openWithdrawModal(banks, wallet.available, wallet.securityCodeSet);
  document.getElementById('addBankBtn').onclick = () => openAddBankModal();
  document.getElementById('secCodeBtn').onclick = () => openSecurityCodeModal(wallet.securityCodeSet);
  const cb = document.getElementById('convertBtn');
  if (cb) cb.onclick = async () => {
    try { await api('/api/wallet/cashback/convert', { method: 'POST' }); render(); }
    catch (err) { alert(err.message); }
  };
}

  }
  walletModal(`
    <h3>Withdraw</h3>
    <p class="muted">Available: ${money(available)}</p>
    <div class="field"><label>Bank Account</label>
      <select id="wdBank">${banks.map(b => `<option value="${b.id}">${b.bank_name} — ${b.account_number} (${b.account_name || ''})</option>`).join('')}</select>

async function adminRenewFree(userId) {
  try { await api(`/api/admin/subscriptions/${userId}/renew`, { method: 'POST' }); render(); }
  catch (err) { alert(err.message); }
}
async function adminDeactivateCoupon(id) {
  await api('/api/admin/coupons/' + id, { method: 'DELETE' }); render();
}

async function adminDecide(resource, id, decision) {
  try { await api(`/api/admin/${resource}/${id}/${decision}`, { method: 'POST' }); renderAdmin(document.getElementById('app')); }
  catch (err) { alert(err.message); }
}
async function adminOrderStatus(id, status) {
  try { await api(`/api/admin/orders/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) }); }
  catch (err) { alert(err.message); }
}
async function adminBan(id) {
  if (!confirm('Zero Tolerance to Fraud — are you sure you want to ban this user?')) return;
  await api(`/api/admin/users/${id}/ban`, { method: 'POST' }); renderAdmin(document.getElementById('app'));
}
async function adminUnban(id) { await api(`/api/admin/users/${id}/unban`, { method: 'POST' }); renderAdmin(document.getElementById('app')); }
async function adminDeleteBanner(id) { await api(`/api/admin/banners/${id}`, { method: 'DELETE' }); renderAdmin(document.getElementById('app')); }

    </div>
  `;
  document.getElementById('regBtn').onclick = async () => {
    try {
      const data = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        phone: document.getElementById('regPhone').value,
        ghana_card: document.getElementById('regCard').value,
        password: document.getElementById('regPassword').value,
      })});
      state.token = data.token; localStorage.setItem('mko_token', data.token);
      state.user = data.user;
      go('home');
    } catch (err) {
      document.getElementById('regError').innerHTML = `<div class="error-box">${err.message}</div>`;
    }
  };
}

    <div class="form-box" style="max-width:640px">
      <h2>Privacy Policy</h2>
      <p class="muted">Last updated 2026</p>
      <p>MakolaOnline collects only the information needed to operate the marketplace: your name, email, phone, delivery addresses, and transaction records.</p>
      <p><strong>Zero Tolerance to Fraud.</strong> Any account found engaging in fraud, scams, or fake listings is automatically banned and reported. All such actions are logged permanently in our history records for investigation.</p>
      <p>We never sell your personal data to third parties. Deposit screenshots and Ghana Card details are used solely for identity verification and payment confirmation.</p>
    </div>
  `;
}

const FAQ = [
  { q: /deposit|wallet/i, a: 'To deposit: go to Profile → Wallet → Deposit, send the money via MoMo/Bank shown, then upload your screenshot. Admin approves within 24 hours.' },
  { q: /order|status/i, a: 'Check your Order page for status. Orders move from Processing → Shipped → Completed.' },
  { q: /vendor|reseller|employer|sell|job/i, a: 'Go to MKO-VENDOR and apply as a Reseller (to sell products) or Employer (to post jobs). Admin will review your application.' },
  { q: /ban|fraud/i, a: 'MakolaOnline has Zero Tolerance to Fraud. Any fraudulent activity leads to an automatic account ban.' },
];
function renderHelp(app) {
  app.innerHTML = `
    <div class="form-box" style="max-width:640px">
      <h2>Help Center</h2>
      <p class="muted">Common questions</p>
      ${FAQ.map(f => `<p><strong>${f.q.source.split('|')[0]}?</strong> ${f.a}</p>`).join('')}
      <p class="muted">Or use the chat bubble in the corner for quick answers.</p>
    </div>
  `;
}

/* ---------------- Chat widget ---------------- */
const chatBubble = document.getElementById('chatBubble');
const chatWindow = document.getElementById('chatWindow');
const chatBody = document.getElementById('chatBody');
chatBubble.onclick = () => {
  chatWindow.classList.toggle('open');
  if (!chatBody.childElementCount) addChatMsg('bot', "Hi! I'm the MakolaOnline helper. Ask me about deposits, orders, or becoming a vendor.");
};
function addChatMsg(who, text) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + who;
  div.textContent = text;
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}
document.getElementById('chatSend').onclick = sendChat;
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addChatMsg('me', text);
  input.value = '';
  const hit = FAQ.find(f => f.q.test(text));
  setTimeout(() => addChatMsg('bot', hit ? hit.a : "I'm not sure about that — please check the Help Center page or contact admin."), 400);
}

/* ---------------- Boot ---------------- */
(async function boot() {
  await loadUser();
  render();
  refreshBell();
})();
</script>
